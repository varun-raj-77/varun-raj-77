<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Varun Karthik, Software Engineer. Still Building.</title>
<desc id="desc">A black banner with Varun Karthik and Software Engineer on the left, and Still Building on the right in white text.</desc>
<rect width="1200" height="270" rx="16" fill="#050505"/>
<rect x="1" y="1" width="1198" height="268" rx="15" fill="none" stroke="#262626" stroke-width="2"/>
<text x="79" y="125" fill="#F7F7F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.7">Varun Karthik</text>
<text x="82" y="177" fill="#CECECE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" font-weight="400">Software Engineer</text>
<line x1="704" y1="72" x2="704" y2="203" stroke="#383838" stroke-width="2"/>
<text x="785" y="145" fill="#F4F4F4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="41" font-weight="400" letter-spacing="3.2">Still Building.</text>
<line x1="964" y1="164" x2="1023" y2="164" stroke="#F4F4F4" stroke-width="2" stroke-linecap="round"/>
</svg>