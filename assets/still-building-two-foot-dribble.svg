<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
<title id="title">Varun Karthik, Software Engineer. Still Building.</title>
<desc id="desc">A monochrome header with a tiny footballer dribbling straight across the lower right, scoring under the headline, celebrating, and receiving two small rounds of applause.</desc>
<defs>
 <style>@media (prefers-reduced-motion: reduce) { #runner-motion, #ball-motion, #celebration-motion, #clap-left, #clap-right { display: none; } #still-frame { display: inline; } }</style>
 <clipPath id="frame"><rect width="1200" height="270" rx="16"/></clipPath>
 <g id="hands" fill="none" stroke="#D1D1D1" stroke-width="1.55" stroke-linejoin="round" stroke-linecap="round">
  <g>
   <animateTransform attributeName="transform" type="translate" values="-2 0;1 0;-2 0" dur=".36s" repeatCount="indefinite"/>
   <path d="M-21 10 L-22 -1 Q-22 -4 -20 -4 Q-18 -4 -17 -1 L-14 4 L-15 -10 Q-15 -13 -12 -12 L-11 2 L-10 -11 Q-9 -13 -7 -11 L-6 2 L-5 -7 Q-4 -9 -2 -7 L-1 6 Q-1 13 -7 15 L-16 15 Z"/>
  </g>
  <g>
   <animateTransform attributeName="transform" type="translate" values="2 0;-1 0;2 0" dur=".36s" repeatCount="indefinite"/>
   <path d="M-21 10 L-22 -1 Q-22 -4 -20 -4 Q-18 -4 -17 -1 L-14 4 L-15 -10 Q-15 -13 -12 -12 L-11 2 L-10 -11 Q-9 -13 -7 -11 L-6 2 L-5 -7 Q-4 -9 -2 -7 L-1 6 Q-1 13 -7 15 L-16 15 Z" transform="scale(-1 1)"/>
  </g>
 </g>
</defs>
<g clip-path="url(#frame)">
 <rect width="1200" height="270" fill="#050505"/>
 <rect x="1" y="1" width="1198" height="268" rx="15" fill="none" stroke="#292929" stroke-width="1.5"/>
 <text x="79" y="126" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="700" letter-spacing="-1.7" fill="#F7F7F7">Varun Karthik</text>
 <text x="82" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="29" fill="#CECECE">Software Engineer</text>
 <line x1="704" y1="64" x2="704" y2="207" stroke="#343434" stroke-width="1.5"/>
 <text x="785" y="95" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="39" letter-spacing="2" fill="#F4F4F4">Still Building.</text>
 <line x1="990" y1="108" x2="1035" y2="108" stroke="#CACACA" stroke-width="1.7" stroke-linecap="round"/>
 
 <!-- Small open goal after the period, at the far right of the heading. -->
 <g transform="translate(80 0)">
 <g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M997 243 V193 H1054 V243" stroke="#E9E9E9" stroke-width="2.4"/>
  <path d="M1003 243 V199 H1048 V243 M1003 199 L997 193 M1048 199 L1054 193" stroke="#858585" stroke-width="1"/>
  <g stroke="#444444" stroke-width=".85">
   <path d="M1014 199 V242 M1026 199 V242 M1037 199 V242 M1003 211 H1048 M1003 224 H1048 M1003 236 H1048"/>
  </g>
 </g>
 </g>

 <!-- The dribble stays on one horizontal baseline. -->
 <g id="runner-motion" opacity="1" stroke="#EEEEEE" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.62;.655;1" dur="8.4s" repeatCount="indefinite"/>
  <g>
   <animateMotion path="M770 233 H1026" calcMode="linear"
      keyPoints="0;0;1;1" keyTimes="0;.12;.55;1" dur="8.4s" repeatCount="indefinite" rotate="0"/>
   <!-- Forward-leaning footballer with independent alternating strides. -->
   <circle cx="19" cy="-41" r="6.7" stroke-width="2.3" fill="#050505"/>
   <path d="M11 -34 L20 -31 L12 -18 L3 -20 L5 -28 Z" fill="#D4D4D4" stroke="#EEEEEE" stroke-width=".85"/>
   <path d="M5 -20 L13 -19 L10 -14 L4 -15 Z" fill="#808080" stroke="none"/>
   <!-- Arms pump forward and backward opposite the running legs. -->
   <path d="M11 -30 L22 -25 L27 -22" stroke-width="2.3">
    <animate attributeName="d"
     values="M11 -30 L22 -25 L27 -22;M11 -30 L2 -24 L-4 -19;M11 -30 L22 -25 L27 -22"
     keyTimes="0;.5;1" dur=".56s" repeatCount="indefinite"/>
   </path>
   <path d="M15 -30 L6 -23 L0 -18" stroke-width="2.3">
    <animate attributeName="d"
     values="M15 -30 L6 -23 L0 -18;M15 -30 L25 -25 L29 -23;M15 -30 L6 -23 L0 -18"
     keyTimes="0;.5;1" dur=".56s" repeatCount="indefinite"/>
   </path>
   <!-- The right foot and left foot alternately reach the ball; both knees bend. -->
   <path d="M8 -17 L17 -10 L24 -6 L27 -6" stroke-width="3">
    <animate attributeName="d"
      values="M8 -17 L17 -10 L24 -6 L27 -6;M8 -17 L0 -7 L-9 1 L-5 1;M8 -17 L17 -10 L24 -6 L27 -6"
      keyTimes="0;.5;1" dur=".56s" repeatCount="indefinite"/>
   </path>
   <path d="M7 -17 L-4 -8 L-13 0 L-9 1" stroke-width="3">
    <animate attributeName="d"
      values="M7 -17 L-4 -8 L-13 0 L-9 1;M7 -17 L17 -11 L24 -7 L27 -7;M7 -17 L-4 -8 L-13 0 L-9 1"
      keyTimes="0;.5;1" dur=".56s" repeatCount="indefinite"/>
   </path>
  </g>
 </g>
 
 <!-- Ball stays close to the foot while dribbling, then is kicked straight into the goal. -->
 <g id="ball-motion" opacity="0">
  <animate attributeName="opacity" values="0;1;1;1;0;0" keyTimes="0;.035;.9;.94;.99;1" dur="8.4s" repeatCount="indefinite"/>
  <g>
   <animateMotion path="M803 227 H1059 H1107" calcMode="linear"
     keyPoints="0;0;.842;.842;1;1" keyTimes="0;.12;.55;.61;.69;1" dur="8.4s" repeatCount="indefinite" rotate="0"/>
   <g>
    <animateTransform attributeName="transform" type="rotate" values="0;0;720;720;910;910" keyTimes="0;.12;.55;.61;.69;1" dur="8.4s" repeatCount="indefinite"/>
    <circle r="7.6" fill="#F7F7F7" stroke="#111111" stroke-width=".8"/>
    <polygon points="0,-3.4 3.4,-1.1 2.2,2.9 -2.2,2.9 -3.4,-1.1" fill="#171717"/>
    <path d="M0 -3.4 V-6.9 M3.4 -1.1 L6.5 -2.8 M2.2 2.9 L5 5.1 M-2.2 2.9 L-5 5.1 M-3.4 -1.1 L-6.5 -2.8" stroke="#292929" stroke-width=".7" fill="none"/>
   </g>
  </g>
 </g>

 <!-- Once the ball is in, the player stops and raises both arms. -->
 <g id="celebration-motion" opacity="0" stroke="#F0F0F0" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.665;.695;.865;.91;1" dur="8.4s" repeatCount="indefinite"/>
  <g transform="translate(1026 233)">
   <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0;0 -2;0 0" dur=".75s" repeatCount="indefinite"/>
    <circle cx="5" cy="-40" r="6.8" stroke-width="2.4" fill="#050505"/>
    <path d="M3 -33 L11 -32 L14 -19 L6 -16 L2 -25 Z" fill="#C9C9C9" stroke="#EEEEEE" stroke-width=".9"/>
    <path d="M4 -29 L-10 -42 M9 -29 L21 -42 M6 -17 L-3 -2 L-8 0 M6 -17 L16 -2 L21 0" stroke-width="2.9"/>
   </g>
  </g>
 </g>
 
 <!-- Two pairs of outline hands, only while the goal is being celebrated. -->
 <g id="clap-left" opacity="0" transform="translate(742 222)">
  <animate attributeName="opacity" values="0;0;.85;.85;0;0" keyTimes="0;.69;.73;.86;.91;1" dur="8.4s" repeatCount="indefinite"/>
  <use href="#hands"/>
 </g>
 <g id="clap-right" opacity="0" transform="translate(1165 222)">
  <animate attributeName="opacity" values="0;0;.85;.85;0;0" keyTimes="0;.69;.73;.86;.91;1" dur="8.4s" repeatCount="indefinite"/>
  <use href="#hands"/>
 </g>
  <!-- Visitors who prefer reduced motion see a clear, still opening frame. -->
 <g id="still-frame" display="none" stroke="#EDEDED" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <g transform="translate(770 233)">
   <circle cx="19" cy="-41" r="6.7" stroke-width="2.3" fill="#050505"/>
   <path d="M11 -34 L20 -31 L12 -18 L3 -20 L5 -28 Z" fill="#D4D4D4" stroke-width=".85"/>
   <path d="M5 -20 L13 -19 L10 -14 L4 -15 Z" fill="#808080" stroke="none"/>
   <path d="M11 -30 L22 -25 L27 -22 M15 -30 L6 -23 L0 -18 M8 -17 L17 -10 L24 -6 M7 -17 L-4 -8 L-13 0" stroke-width="2.8"/>
  </g>
  <circle cx="803" cy="227" r="7.6" fill="#F7F7F7" stroke="#111111" stroke-width=".8"/>
  <polygon points="803,223 806,226 805,230 801,230 800,226" fill="#171717"/>
 </g>
</g>
</svg>